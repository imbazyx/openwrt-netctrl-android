<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #050410; overflow: hidden; }
#map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.leaflet-popup-content-wrapper {
  background: #0D0B1E; color: #C0B0F0;
  border: 1px solid #2A2250; border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.leaflet-popup-tip { background: #0D0B1E; }
.leaflet-popup-close-button { color: #8B949E !important; font-size: 18px !important; }
.popup-name { font-weight: 600; color: #E6EDF3; font-size: 15px; margin-bottom: 4px; }
.popup-status-online { color: #3FB950; font-size: 12px; }
.popup-status-offline { color: #F85149; font-size: 12px; }
.popup-meta { color: #8B949E; font-size: 11px; margin: 2px 0; }
.popup-actions {
  display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px;
}
.popup-btn {
  background: #16133A; color: #E6EDF3; border: 1px solid #2A2250;
  padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
  flex: 1; min-width: 60px; text-align: center;
}
.popup-btn:hover { background: #7050C8; border-color: #7050C8; }
.popup-btn-danger { border-color: rgba(248,81,73,0.5); color: #F85149; }
.popup-btn-danger:hover { background: rgba(248,81,73,0.2); }
#pick-confirm {
  display: none; position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
  background: rgba(13,11,30,0.97); border: 1px solid #2A2250;
  border-radius: 10px; padding: 12px 16px; z-index: 1000; min-width: 260px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
#pick-addr { color: #C0B0F0; font-size: 12px; margin-bottom: 10px; word-break: break-word; }
.pick-btns { display: flex; gap: 8px; }
.pick-btn-ok {
  background: #7050C8; color: white; border: none; padding: 7px 16px;
  border-radius: 6px; cursor: pointer; flex: 1; font-size: 13px;
}
.pick-btn-cancel {
  background: transparent; color: #8B949E; border: 1px solid #2A2250;
  padding: 7px 16px; border-radius: 6px; cursor: pointer; flex: 1; font-size: 13px;
}
</style>
<link rel="stylesheet" href="leaflet.min.css" />
</head>
<body>
<div id="map"></div>
<div id="tile-error" style="display:none;position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(13,11,30,0.95);color:#F85149;border:1px solid rgba(248,81,73,0.4);border-radius:8px;padding:10px 20px;z-index:1000;font-size:13px;pointer-events:none;white-space:nowrap;">
  &#9888; Карта недоступна без интернета
</div>
<div id="pick-confirm">
  <div id="pick-addr">Загрузка адреса...</div>
  <div class="pick-btns">
    <button class="pick-btn-ok" id="pick-ok">Подтвердить</button>
    <button class="pick-btn-cancel" id="pick-cancel">Отмена</button>
  </div>
</div>
<script src="leaflet.min.js"></script>
<script>
// Console bridge for Android
if (window.AndroidBridge && !window.console) window.console = {};
if (window.AndroidBridge) {
  var _origLog = console.log || function(){};
  console.log = function(m) {
    try { AndroidBridge.log(typeof m === 'object' ? JSON.stringify(m) : String(m)); } catch(e){}
    _origLog.apply(console, arguments);
  };
}
console.log('Map HTML loaded, AndroidBridge=' + (window.AndroidBridge ? 'OK' : 'MISSING'));
console.log('L (Leaflet) = ' + (typeof L !== 'undefined' ? 'OK' : 'UNDEFINED'));
console.log('map div = ' + (document.getElementById('map') ? 'OK' : 'NULL'));
function showMapError(msg) {
  var el = document.getElementById('tile-error');
  el.innerHTML = '&#9888; ' + (msg || 'Карта недоступна без интернета');
  el.style.display = 'block';
}

var map, tiles;
try {
  map = L.map('map', { center: [55.75, 37.62], zoom: 5, zoomControl: true });
  var tileErrorShown = false;
  tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
  });
  tiles.on('tileerror', function() {
    if (!tileErrorShown) { tileErrorShown = true; showMapError('Карта недоступна без интернета'); }
  });
  tiles.addTo(map);
  console.log('Map initialized, center=' + map.getCenter() + ' zoom=' + map.getZoom());
function resizeMap() {
  var w = window.innerWidth || document.documentElement.clientWidth;
  var h = window.innerHeight || document.documentElement.clientHeight;
  document.getElementById('map').style.width = w + 'px';
  document.getElementById('map').style.height = h + 'px';
  if (map) map.invalidateSize();
}
resizeMap();
window.addEventListener('resize', resizeMap);
setTimeout(resizeMap, 500);
var computedStyle = window.getComputedStyle(document.getElementById('map'));
console.log('Map bg=' + computedStyle.backgroundColor + ' width=' + computedStyle.width + ' height=' + computedStyle.height);
setTimeout(function() {
  var tiles = document.querySelectorAll('.leaflet-tile');
  console.log('Tiles loaded count=' + tiles.length);
}, 2000);
} catch(e) {
  showMapError('Ошибка инициализации карты');
}

function makeIcon(online) {
  const color = online ? '#3FB950' : '#F85149';
  return L.divIcon({
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,0.8);box-shadow:0 2px 8px rgba(0,0,0,0.5)"></div>`,
    iconSize: [16, 16], iconAnchor: [8, 8], className: ''
  });
}

function makePopupHtml(a) {
  const name = a.display_name || a.agent_id;
  const statusCls = a.online ? 'popup-status-online' : 'popup-status-offline';
  const statusTxt = a.online ? '● Online' : '● Offline';
  const id = a.agent_id.replace(/'/g, "\\'");
  let html = `<div class="popup-name">${name}</div>`;
  html += `<div class="${statusCls}">${statusTxt}</div>`;
  if (a.address) html += `<div class="popup-meta">📍 ${a.address}</div>`;
  if (a.local_ip) html += `<div class="popup-meta">IP: ${a.local_ip}</div>`;
  
  // Метрики
  if (a.cpu_load != null) {
    html += `<div class="popup-meta">CPU Load: ${a.cpu_load.toFixed(2)}</div>`;
  }
  if (a.mem_total && a.mem_total > 0 && a.mem_free != null) {
    const usedMem = Math.round((a.mem_total - a.mem_free) / 1024);
    const totalMem = Math.round(a.mem_total / 1024);
    html += `<div class="popup-meta">RAM: ${usedMem}/${totalMem} MB</div>`;
  }
  if (a.temperature && a.temperature > 0) {
    html += `<div class="popup-meta">Temp: ${a.temperature.toFixed(1)}°C</div>`;
  }

  html += `<div class="popup-actions">`;
  html += `<button class="popup-btn" onclick="if(window.AndroidBridge)AndroidBridge.openLuci('${id}')">LuCI</button>`;
  html += `<button class="popup-btn" onclick="if(window.AndroidBridge)AndroidBridge.openSsh('${id}')">SSH</button>`;
  html += `<button class="popup-btn" onclick="if(window.AndroidBridge)AndroidBridge.openMetrics('${id}')">Метрики</button>`;
  html += `<button class="popup-btn" onclick="if(window.AndroidBridge)AndroidBridge.onAgentClick('${id}')">Карточка</button>`;
  html += `<button class="popup-btn popup-btn-danger" onclick="confirmDelete('${id}','${name}')">Удалить</button>`;
  html += `</div>`;
  return html;
}

function confirmDelete(agentId, name) {
  if (confirm('Удалить роутер ' + name + '?')) {
    if (window.AndroidBridge) AndroidBridge.deleteAgent(agentId);
  }
}

var markers = {};

window.setAgents = function(json) {
  if (!map) return;
  try {
    var agents = (typeof json === 'string') ? JSON.parse(json) : json;
    Object.values(markers).forEach(function(m) { map.removeLayer(m); });
    markers = {};
    agents.forEach(function(a) {
      if (a.lat == null || a.lng == null) return;
      var m = L.marker([a.lat, a.lng], { icon: makeIcon(a.online) });
      m.bindPopup(makePopupHtml(a), { maxWidth: 260 });
      m.addTo(map);
      markers[a.agent_id] = m;
    });
  } catch(e) {}
};

window.fitBounds = function() {
  if (!map) return;
  var ml = Object.values(markers);
  if (ml.length > 0) { try { map.fitBounds(L.featureGroup(ml).getBounds().pad(0.15)); } catch(e){} }
};

window.refreshAgents = function() {
  if (window.AndroidBridge) {
    try { window.setAgents(AndroidBridge.getAgentsJson()); } catch(e) {}
  }
};

document.addEventListener('DOMContentLoaded', function() {
  if (window.AndroidBridge) {
    window.setAgents(AndroidBridge.getAgentsJson());
    window.fitBounds();
  }
  setInterval(window.refreshAgents, 30000);
});

// ─── Pick Mode ───────────────────────────────────────────────────────────────
var pickMode = false;
var tempPickMarker = null;
var pendingLat = null, pendingLng = null, pendingAddr = '';

window.enterPickMode = function() { pickMode = true; };

window.exitPickMode = function() {
  pickMode = false;
  if (tempPickMarker && map) { map.removeLayer(tempPickMarker); tempPickMarker = null; }
  document.getElementById('pick-confirm').style.display = 'none';
};

document.getElementById('pick-ok').onclick = function() {
  if (pendingLat !== null && window.AndroidBridge) {
    AndroidBridge.onLocationPicked(pendingLat, pendingLng);
    if (pendingAddr) AndroidBridge.onAddressPicked(pendingAddr);
  }
  document.getElementById('pick-confirm').style.display = 'none';
  pickMode = false;
};

document.getElementById('pick-cancel').onclick = function() {
  window.exitPickMode();
  if (window.AndroidBridge) AndroidBridge.onAddressPicked('');
};

map.on('click', function(e) {
  if (!pickMode) return;
  var lat = e.latlng.lat, lng = e.latlng.lng;
  pendingLat = lat; pendingLng = lng; pendingAddr = '';

  if (tempPickMarker) map.removeLayer(tempPickMarker);
  tempPickMarker = L.marker([lat, lng], {
    icon: L.divIcon({
      html: '<div style="font-size:22px;line-height:1">📍</div>',
      iconSize: [24, 28], iconAnchor: [12, 28], className: ''
    })
  }).addTo(map);

  var confirmEl = document.getElementById('pick-confirm');
  var addrEl = document.getElementById('pick-addr');
  addrEl.textContent = 'Загрузка адреса...';
  confirmEl.style.display = 'block';

  // Nominatim reverse geocoding
  fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&accept-language=ru')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      pendingAddr = data.display_name || (lat.toFixed(5) + ', ' + lng.toFixed(5));
      addrEl.textContent = '📍 ' + pendingAddr;
    })
    .catch(function() {
      pendingAddr = lat.toFixed(5) + ', ' + lng.toFixed(5);
      addrEl.textContent = '📍 ' + pendingAddr;
    });
});
</script>
</body>
</html>
